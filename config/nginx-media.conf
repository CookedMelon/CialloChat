# Included inside the top-level stream block (not inside http).
# TLS stays end-to-end between OBS and MediaMTX. Only registered SNI routes
# are accepted; add future TLS services here with their own hostnames.
map $ssl_preread_server_name $ciallochat_tls_backend {
    chat.v50to.cc 127.0.0.1:1936;
    default      127.0.0.1:1;
}

limit_conn_zone $binary_remote_addr zone=ciallochat_media_ip:1m;
log_format ciallochat_media '$remote_addr [$time_local] $protocol $status '
                           '$bytes_sent $bytes_received $session_time';

server {
    listen 443;
    ssl_preread on;
    preread_timeout 5s;
    proxy_pass $ciallochat_tls_backend;
    proxy_protocol on;
    proxy_connect_timeout 3s;
    proxy_timeout 60s;
    proxy_socket_keepalive on;
    limit_conn ciallochat_media_ip 8;
    access_log /var/log/nginx/ciallochat-media.log ciallochat_media;
}

server {
    listen 554;
    proxy_pass 127.0.0.1:8554;
    proxy_protocol on;
    proxy_connect_timeout 3s;
    proxy_timeout 60s;
    proxy_socket_keepalive on;
    limit_conn ciallochat_media_ip 8;
    access_log /var/log/nginx/ciallochat-media.log ciallochat_media;
}
