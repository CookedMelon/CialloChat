# 仅展示由 CLI 生成的认证结构；完整固定配置来自 config/mediamtx.base.yml。
# 占位哈希不能用于启动。真实配置必须通过 streamctl 生成。
authMethod: http
authHTTPAddress: http://auth:9000/auth
authHTTPExclude: []
authInternalUsers:
  - user: ciallochat-control
    pass: "argon2:<管理密钥哈希>"
    ips: []
    permissions: [{action: api}]
  - user: alice
    pass: "argon2:<推流密钥哈希>"
    ips: []
    permissions: [{action: publish, path: live/alice}]
  - user: ciallochat-read-alice
    pass: "argon2:<观看密钥哈希>"
    ips: []
    permissions: [{action: read, path: live/alice}]
  - user: ciallochat-revision-<由完整配置计算的标记>
    pass: ""
    ips: []
    permissions: []
paths:
  live/alice: {}
